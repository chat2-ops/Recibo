<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17243a">
<title>VendaFácil — Loja de celulares</title>
<style>
:root{--ink:#18263c;--muted:#667085;--blue:#4169e1;--blue2:#3154c5;--bg:#f3f5f9;--line:#e5e9f0;--green:#16845b;--red:#c13c42;--amber:#9b6500;--white:#fff;--shadow:0 8px 24px rgba(20,35,59,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1120px;margin:auto;min-height:100vh}.topbar{background:var(--ink);color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:19px;font-weight:800;letter-spacing:.2px}.brand small{display:block;font-size:11px;font-weight:500;color:#cbd5e1;margin-top:3px}.local-note{font-size:11px;color:#d5ddeb;text-align:right}.nav{display:flex;gap:8px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);overflow:auto}.nav button{border:0;background:transparent;padding:10px 13px;border-radius:10px;color:var(--muted);font-weight:700;white-space:nowrap}.nav button.active,.nav button:hover{background:#edf1ff;color:var(--blue)}main{padding:22px;}.notice{background:#fff8e6;border:1px solid #f2dfaa;color:#775500;padding:12px 14px;border-radius:12px;font-size:12px;margin-bottom:16px;line-height:1.5}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px}.pagehead h1{font-size:23px;margin:0}.pagehead p{margin:5px 0 0;color:var(--muted);font-size:13px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:750;background:var(--blue);color:#fff}.btn:hover{background:var(--blue2)}.btn.secondary{background:#edf1ff;color:var(--blue)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:var(--red)}.btn.small{padding:8px 10px;font-size:12px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--white);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow)}.stat-label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.4px}.stat-value{font-size:23px;font-weight:850;margin-top:9px}.stat-sub{font-size:11px;color:var(--muted);margin-top:5px}.columns{grid-template-columns:1.15fr .85fr}.section-title{font-size:15px;font-weight:800;margin:0 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row-title{font-size:13px;font-weight:750}.muted{color:var(--muted);font-size:12px}.amount{font-weight:800;white-space:nowrap}.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800;background:#edf1ff;color:var(--blue)}.badge.green{background:#e6f6ed;color:var(--green)}.badge.red{background:#fff0f0;color:var(--red)}.badge.amber{background:#fff5dc;color:var(--amber)}.actions{display:flex;gap:8px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#475467;font-weight:800}.field input,.field select{width:100%;border:1px solid #d8dee9;border-radius:9px;background:#fff;padding:11px 12px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4169e122}.help{font-size:11px;color:var(--muted);line-height:1.45}.preview{background:#edf1ff;border-radius:12px;padding:14px;margin-top:14px}.preview strong{font-size:17px}.preview .smallline{font-size:12px;margin-top:6px;color:#42516b}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:630px}.table th,.table td{padding:11px 9px;text-align:left;border-bottom:1px solid var(--line);font-size:12px}.table th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.3px}.empty{text-align:center;padding:30px 15px;color:var(--muted);font-size:13px}.receipt{max-width:720px;margin:auto}.receipthead{text-align:center;border-bottom:1px dashed #c8d0dd;padding:10px 0 18px;margin-bottom:16px}.receipthead h2{margin:0 0 5px}.receipt-total{background:#f5f7fa;border-radius:10px;padding:14px;margin:14px 0}.installments{width:100%;border-collapse:collapse}.installments td,.installments th{border-bottom:1px solid var(--line);padding:9px 5px;font-size:12px;text-align:left}.installments th{font-size:10px;color:var(--muted);text-transform:uppercase}.paid{color:var(--green);font-weight:800}.late{color:var(--red);font-weight:800}.footer-note{font-size:11px;color:var(--muted);margin-top:18px}.contractlist{display:grid;gap:10px}.contract{display:flex;justify-content:space-between;gap:12px;align-items:center}.contract-info{min-width:0}.contract-info strong{display:block}.contract-info small{color:var(--muted);display:block;margin-top:4px}.contract-actions{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none!important}.block-note{margin-top:14px;background:#fff8e6;padding:11px;border-radius:10px;font-size:11px;color:#775500}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17243a;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);z-index:10}.bottomspace{height:20px}
@media(max-width:760px){main{padding:15px}.topbar{padding:15px}.nav{padding:8px 10px}.nav button{padding:9px 10px;font-size:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}.pagehead h1{font-size:20px}.local-note{max-width:145px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.contract{align-items:flex-start;flex-direction:column}.contract-actions{width:100%}}
@media print{body{background:#fff}.topbar,.nav,.notice,.no-print,.pagehead,.footer-note{display:none!important}main{padding:0}.card{box-shadow:none;border:0;padding:0}.receipt{max-width:100%}.receipthead{padding-top:0}.app{max-width:none}.installments td,.installments th{padding:7px 4px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand">VendaFácil <small>Controle da loja • celular e acessórios</small></div><div class="local-note">Versão inicial<br>salva neste aparelho</div></header>
<nav class="nav" aria-label="Menu principal">
<button data-page="home" class="active">Resumo</button><button data-page="new-sale">Nova venda</button><button data-page="products">Produtos</button><button data-page="sales">Contratos</button>
</nav>
<main>
<div class="notice"><strong>Importante:</strong> os dados ficam salvos somente neste navegador/aparelho. Não há conta, sincronização nem bloqueio remoto nesta versão. Faça uma cópia de segurança regularmente e não use em aparelho compartilhado.</div>
<div id="view"></div>
<div class="bottomspace"></div>
</main>
</div>
<div id="toast" class="toast hidden"></div>
<script>
(()=>{
'use strict';
const KEY='vendafacil_local_v1';
const brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const addMonth=(iso,increment)=>{const [yy,mm,dd]=iso.split('-').map(Number);const first=new Date(yy,mm-1+increment,1);const last=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();first.setDate(Math.min(dd,last));return `${first.getFullYear()}-${String(first.getMonth()+1).padStart(2,'0')}-${String(first.getDate()).padStart(2,'0')}`};
const fmtDate=(iso)=>{if(!iso)return '—';const [y,m,d]=iso.split('-');return `${d}/${m}/${y}`};
const esc=(v)=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const money=(n)=>brl.format(Number(n)||0);
let state={products:[],sales:[]}, page='home', receiptId=null, toastTimer, editingProductId=null;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Array.isArray(saved.products)&&Array.isArray(saved.sales))state=saved;}catch(e){}
function persist(){localStorage.setItem(KEY,JSON.stringify(state));}
function newId(){return (globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():`vf-${Date.now()}-${Math.random().toString(36).slice(2)}`;}
function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2600)}
function setPage(p,id=null){if(page==='products'&&p!=='products')editingProductId=null;page=p;receiptId=id;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p||(p==='edit-sale'&&b.dataset.page==='sales')));render()}
function setNav(){document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));}
function statusSale(s){if(s.installments.every(i=>i.paid))return 'Quitado';if(s.installments.some(i=>!i.paid&&i.due<todayISO()))return 'Atrasado';return 'Em dia'}
function calc(principal,n,monthly){principal=Math.round((Number(principal)||0)*100)/100;n=Math.max(1,parseInt(n)||1);const rate=(Number(monthly)||0)/100;const total=Math.round(principal*(1+rate*n)*100)/100;const installment=Math.round(total/n*100)/100;const amounts=Array(n).fill(installment);if(n>1)amounts[n-1]=Math.round((total-installment*(n-1))*100)/100;const interest=Math.round((total-principal)*100)/100;return {installment,total,interest,amounts};}
function installmentLabel(amounts){if(!amounts||!amounts.length)return '—';const first=amounts[0],last=amounts[amounts.length-1];if(amounts.length>1&&Math.abs(last-first)>=0.01)return `${amounts.length-1}x de ${money(first)} + última de ${money(last)}`;return `${amounts.length}x de ${money(first)}`}
function installmentSummary(s){return installmentLabel((s.installments||[]).map(i=>i.amount))}
function defaultDue(){return addMonth(todayISO(),1)}
function render(){setNav();const root=document.querySelector('#view');if(page==='home')root.innerHTML=homeHTML();else if(page==='products')root.innerHTML=productsHTML();else if(page==='new-sale')root.innerHTML=saleFormHTML();else if(page==='edit-sale')root.innerHTML=saleFormHTML(receiptId);else if(page==='sales')root.innerHTML=salesHTML();else if(page==='receipt')root.innerHTML=receiptHTML(receiptId);bindPage()}
function homeHTML(){const active=state.sales.length;const overdue=state.sales.filter(s=>statusSale(s)==='Atrasado').length;const outstanding=state.sales.reduce((sum,s)=>sum+s.installments.filter(i=>!i.paid).reduce((a,i)=>a+i.amount,0),0);const stock=state.products.reduce((a,p)=>a+p.stock,0);const recent=[...state.sales].slice(-5).reverse();return `<div class="pagehead"><div><h1>Resumo da loja</h1><p>Vendas parceladas e produtos em estoque</p></div><button class="btn" data-go="new-sale">＋ Nova venda</button></div>
<div class="grid stats"><div class="card"><div class="stat-label">Contratos</div><div class="stat-value">${active}</div><div class="stat-sub">vendas cadastradas</div></div><div class="card"><div class="stat-label">A receber</div><div class="stat-value">${money(outstanding)}</div><div class="stat-sub">parcelas ainda não pagas</div></div><div class="card"><div class="stat-label">Atrasados</div><div class="stat-value">${overdue}</div><div class="stat-sub">contratos com vencimento passado</div></div><div class="card"><div class="stat-label">Unidades em estoque</div><div class="stat-value">${stock}</div><div class="stat-sub">celulares e acessórios</div></div></div>
<div class="grid columns"><section class="card"><h2 class="section-title">Vendas recentes</h2>${recent.length?recent.map(s=>`<div class="row"><div><div class="row-title">${esc(s.customer)} • ${esc(s.itemName)}</div><div class="muted">${installmentSummary(s)} · ${esc(s.whatsapp)}</div></div><div><span class="badge ${statusSale(s)==='Atrasado'?'red':statusSale(s)==='Quitado'?'green':''}">${statusSale(s)}</span><br><button class="btn small secondary" data-receipt="${s.id}" style="margin-top:7px">Ver recibo</button></div></div>`).join(''):'<div class="empty">Ainda não há vendas. Cadastre produtos e depois lance sua primeira venda.</div>'}</section>
<section class="card"><h2 class="section-title">Atalhos</h2><div class="actions"><button class="btn" data-go="new-sale">Nova venda</button><button class="btn secondary" data-go="products">Cadastrar produto</button><button class="btn ghost" data-export>Baixar cópia dos dados</button></div><div class="block-note"><strong>Bloqueio remoto não incluído.</strong> Requer integração específica e compatibilidade confirmada para cada modelo. Esta versão não bloqueia aparelhos.</div><p class="help">A cópia salva um arquivo JSON com seus dados. Guarde-o em local seguro.</p></section></div>`}
function productsHTML(){return `<div class="pagehead"><div><h1>Produtos e estoque</h1><p>Registre o custo de compra, preço de venda e quantidade.</p></div></div><div class="grid columns"><section class="card"><h2 id="product-form-title" class="section-title">Cadastrar produto</h2><form id="product-form" class="formgrid"><div class="field full"><label>Produto ou modelo</label><input name="name" required maxlength="70" placeholder="Ex.: Película 3D, capinha, iPhone 13"></div><div class="field"><label>Categoria</label><select name="category"><option>Celular</option><option>Película</option><option>Capinha</option><option>Carregador</option><option>Acessório</option><option>Outro</option></select></div><div class="field"><label>Quantidade inicial</label><input name="stock" type="number" min="0" step="1" value="1" required></div><div class="field"><label>Custo de compra por unidade (R$)</label><input name="cost" type="number" min="0" step="0.01" required placeholder="0,00"></div><div class="field"><label>Preço de venda por unidade (R$)</label><input name="price" type="number" min="0.01" step="0.01" required placeholder="0,00"></div><div class="field full"><div class="actions"><button id="product-submit" class="btn" type="submit">Salvar produto</button><button id="product-cancel" class="btn ghost hidden" type="button">Cancelar edição</button></div></div></form></section><section class="card"><h2 class="section-title">Resumo do estoque</h2><div id="stock-summary"></div></section></div><section class="card" style="margin-top:14px"><h2 class="section-title">Itens cadastrados</h2><div id="duplicate-alert"></div><div id="product-table"></div></section>`}
function saleFormHTML(editId=null){const old=editId?state.sales.find(s=>s.id===editId):null;const available=p=>p.stock+(old&&p.id===old.productId?old.quantity:0);const products=state.products.filter(p=>available(p)>0);const options=products.map(p=>`<option value="${p.id}" ${old&&old.productId===p.id?'selected':''}>${esc(p.name)} — ${available(p)} em estoque — venda ${money(p.price)}</option>`).join('');const hasProducts=products.length>0;const next=old?old.firstDue:defaultDue();const title=old?'Editar venda':'Nova venda';return `<div class="pagehead"><div><h1>${title}</h1><p>${old?'Altere os dados da venda e recalcule as parcelas. Só é permitido antes de marcar pagamentos.':'Defina a taxa de juros para este contrato, se quiser cobrar.'}</p></div></div>${hasProducts?`<section class="card"><form id="sale-form"><div class="formgrid"><div class="field"><label>Nome do cliente</label><input name="customer" value="${esc(old?.customer||'')}" maxlength="70" required placeholder="Nome completo"></div><div class="field"><label>WhatsApp do cliente</label><input name="whatsapp" value="${esc(old?.whatsapp||'')}" type="tel" maxlength="20" required placeholder="DDD + número"></div><div class="field full"><label>Produto vendido</label><select name="productId" required><option value="">Escolha um produto do estoque</option>${options}</select></div><div class="field"><label>Quantidade</label><input name="quantity" type="number" min="1" max="${old?available(state.products.find(p=>p.id===old.productId)||{stock:0,id:''}):''}" step="1" value="${old?.quantity||1}" required></div><div class="field"><label>Preço de venda por unidade (R$)</label><input name="unitPrice" type="number" min="0.01" step="0.01" value="${old?.unitPrice||''}" required></div><div class="field"><label>Número de parcelas</label><input name="n" type="number" min="1" max="48" step="1" value="${old?.n||1}" required></div><div class="field"><label>Juros ao mês (%) — definido nesta venda</label><input name="rate" type="number" min="0" max="100" step="0.01" value="${old?old.rate:''}" placeholder="0,00"></div><div class="field"><label>Primeiro vencimento</label><input name="firstDue" type="date" value="${esc(next)}" required></div></div><div id="sale-preview" class="preview"></div><div class="actions" style="margin-top:14px"><button class="btn" type="submit">${old?'Salvar alterações':'Salvar venda e gerar recibo'}</button>${old?'<button class="btn ghost" type="button" data-cancel-sale-edit>Cancelar</button>':'<button class="btn ghost" type="button" data-go="products">Voltar aos produtos</button>'}</div></form><div class="block-note">Juros simples: a taxa mensal é aplicada ao valor original a cada mês, sem juros sobre juros. Se houver diferença de centavos, a última parcela é ajustada. O bloqueio remoto não está disponível nesta versão.</div></section>`:'<section class="card"><div class="empty">Cadastre primeiro o celular ou acessório em Produtos, informando custo, preço e estoque.<br><br><button class="btn" data-go="products">Cadastrar produto</button></div></section>'}`}
function salesHTML(){const list=[...state.sales].reverse();return `<div class="pagehead"><div><h1>Contratos</h1><p>Consulte parcelas, recibos e situação de pagamento.</p></div><button class="btn" data-go="new-sale">＋ Nova venda</button></div><section class="card">${list.length?`<div class="contractlist">${list.map(s=>`<div class="row contract"><div class="contract-info"><strong>${esc(s.customer)} — ${esc(s.itemName)}</strong><small>${installmentSummary(s)} · ${esc(s.whatsapp)} · início ${fmtDate(s.firstDue)}</small></div><div class="contract-actions"><span class="badge ${statusSale(s)==='Atrasado'?'red':statusSale(s)==='Quitado'?'green':''}">${statusSale(s)}</span><button class="btn small ghost" data-edit-sale="${s.id}">Editar venda</button><button class="btn small danger" data-delete-sale="${s.id}">Excluir</button><button class="btn small secondary" data-receipt="${s.id}">Recibo / parcelas</button></div></div>`).join('')}</div>`:'<div class="empty">Nenhum contrato registrado ainda.</div>'}</section>`}
function receiptHTML(id){const s=state.sales.find(x=>x.id===id);if(!s){page='sales';return salesHTML()}const status=statusSale(s);return `<div class="pagehead no-print"><div><h1>Recibo e parcelas</h1><p>Contrato da venda registrada</p></div><div class="actions"><button class="btn ghost" data-go="sales">Voltar</button><button class="btn secondary" data-edit-sale="${s.id}" ${s.installments.some(it=>it.paid)?'disabled title="Venda com pagamentos registrados não pode ser alterada."':''}>Editar venda</button><button class="btn danger" data-delete-sale="${s.id}">Excluir contrato</button><button class="btn" data-print>Imprimir / salvar PDF</button><button class="btn secondary" data-share="${s.id}">Compartilhar recibo</button></div></div><section class="card receipt"><div class="receipthead"><h2>RECIBO DE VENDA PARCELADA</h2><div class="muted">VendaFácil • comprovante gerado em ${fmtDate(s.createdAt)}</div></div><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:10px"><div><div class="muted">CLIENTE</div><strong>${esc(s.customer)}</strong><div class="muted" style="margin-top:4px">WhatsApp: ${esc(s.whatsapp)}</div></div><div><div class="muted">PRODUTO</div><strong>${esc(s.itemName)}</strong><div class="muted" style="margin-top:4px">Quantidade: ${s.quantity}</div></div></div><div class="receipt-total"><div><strong>Valor dos produtos: ${money(s.principal)}</strong></div><div class="muted" style="margin-top:6px">Juros simples sobre valor original: ${Number(s.rate).toFixed(2).replace('.',',')}% ao mês · juros totais ${money(s.interest)}</div><div style="margin-top:6px"><strong>Total a pagar: ${money(s.total)} · ${s.n} parcelas</strong></div></div><table class="installments"><thead><tr><th>Parcela</th><th>Vencimento</th><th>Valor</th><th>Status</th><th class="no-print">Ação</th></tr></thead><tbody>${s.installments.map((it,idx)=>`<tr><td>${String(idx+1).padStart(2,'0')} / ${s.n}</td><td>${fmtDate(it.due)}</td><td>${money(it.amount)}</td><td class="${it.paid?'paid':it.due<todayISO()?'late':''}">${it.paid?'Paga':it.due<todayISO()?'Atrasada':'Pendente'}</td><td class="no-print"><button class="btn small ${it.paid?'ghost':'secondary'}" data-toggle-paid="${s.id}" data-index="${idx}">${it.paid?'Desfazer':'Marcar paga'}</button></td></tr>`).join('')}</tbody></table><div class="footer-note">As datas seguem mensalmente a partir do primeiro vencimento escolhido. Guarde este comprovante. Confirme o recebimento antes de marcar uma parcela como paga.</div><div class="block-note no-print">Este controle é local e não confirma pagamentos bancários automaticamente. Nenhum bloqueio remoto de aparelho é executado.</div></section>`}
function bindPage(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setPage(b.dataset.go));document.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>setPage('receipt',b.dataset.receipt));document.querySelectorAll('[data-edit-sale]').forEach(b=>b.onclick=()=>beginEditSale(b.dataset.editSale));document.querySelectorAll('[data-delete-sale]').forEach(b=>b.onclick=()=>deleteSale(b.dataset.deleteSale));const pf=document.querySelector('#product-form');if(pf)pf.onsubmit=addProduct;const cancel=document.querySelector('#product-cancel');if(cancel)cancel.onclick=cancelProductEdit;const cancelSale=document.querySelector('[data-cancel-sale-edit]');if(cancelSale)cancelSale.onclick=()=>setPage('receipt',receiptId);const sf=document.querySelector('#sale-form');if(sf){sf.querySelector('[name=productId]').onchange=()=>{const p=state.products.find(x=>x.id===sf.elements.namedItem('productId').value);if(p)sf.elements.namedItem('unitPrice').value=p.price;previewSale()};['quantity','unitPrice','n','rate','firstDue'].forEach(name=>sf.elements.namedItem(name).addEventListener('input',previewSale));previewSale();sf.onsubmit=page==='edit-sale'?updateSale:addSale;}document.querySelectorAll('[data-toggle-paid]').forEach(b=>b.onclick=()=>togglePaid(b.dataset.togglePaid,Number(b.dataset.index)));const pr=document.querySelector('[data-print]');if(pr)pr.onclick=()=>window.print();document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>shareReceipt(b.dataset.share));const ex=document.querySelector('[data-export]');if(ex)ex.onclick=exportBackup;if(page==='products')renderProductTable();}
function productKey(p){const norm=v=>String(v||'').trim().toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'');return `${norm(p.name)}::${norm(p.category)}`}
function duplicateGroups(){const map=new Map();state.products.forEach(p=>{const k=productKey(p);if(!map.has(k))map.set(k,[]);map.get(k).push(p)});return [...map.values()].filter(group=>group.length>1)}
function consolidateProductRecords(matches,incoming=null){const primary=matches[0],ids=new Set(matches.map(p=>p.id));const oldStock=matches.reduce((a,p)=>a+p.stock,0),incomingStock=incoming?incoming.stock:0,totalStock=oldStock+incomingStock;const inventoryValue=matches.reduce((a,p)=>a+p.stock*p.cost,0)+(incoming?incoming.stock*incoming.cost:0);const latest=matches[matches.length-1];primary.name=incoming?incoming.name:latest.name;primary.category=incoming?incoming.category:latest.category;primary.stock=totalStock;primary.cost=totalStock?Math.round(inventoryValue/totalStock*100)/100:(incoming?incoming.cost:latest.cost);primary.price=incoming?incoming.price:latest.price;state.products=state.products.filter(p=>!ids.has(p.id)||p.id===primary.id);state.sales.forEach(s=>{if(ids.has(s.productId))s.productId=primary.id});return primary}
function addProduct(e){e.preventDefault();const f=e.currentTarget;const data={name:f.elements.namedItem('name').value.trim(),category:f.elements.namedItem('category').value,stock:Math.max(0,parseInt(f.elements.namedItem('stock').value)||0),cost:Number(f.elements.namedItem('cost').value),price:Number(f.elements.namedItem('price').value)};if(!data.name||data.cost<0||data.price<=0){toast('Confira o nome e os valores do produto.');return}if(editingProductId){const existing=state.products.find(x=>x.id===editingProductId);if(!existing){toast('Esse item não foi encontrado.');cancelProductEdit();return}Object.assign(existing,data);editingProductId=null;persist();toast('Item atualizado.');render()}else{const matches=state.products.filter(p=>productKey(p)===productKey(data));if(matches.length){const existingStock=matches.reduce((a,p)=>a+p.stock,0),incomingStock=data.stock,total=existingStock+incomingStock;const inventoryValue=matches.reduce((a,p)=>a+p.stock*p.cost,0)+incomingStock*data.cost;const avg=total?Math.round(inventoryValue/total*100)/100:data.cost;const detail=matches.length>1?` Vou unir também os ${matches.length} cadastros repetidos.`:'';if(!confirm(`Já existe “${data.name}” na categoria ${data.category}.${detail} Estoque: ${existingStock} + ${incomingStock} = ${total} unidades. O custo médio ficará ${money(avg)} e o preço de venda será atualizado para ${money(data.price)}. Confirmar?`))return;consolidateProductRecords(matches,data);persist();toast('Estoque atualizado no cadastro existente.')}else{state.products.push({id:newId(),...data});persist();toast('Produto salvo no estoque.')}render()}}
function editProduct(id){const p=state.products.find(x=>x.id===id);const f=document.querySelector('#product-form');if(!p||!f)return;editingProductId=id;f.elements.namedItem('name').value=p.name;f.elements.namedItem('category').value=p.category;f.elements.namedItem('stock').value=p.stock;f.elements.namedItem('cost').value=p.cost;f.elements.namedItem('price').value=p.price;document.querySelector('#product-form-title').textContent='Editar produto';document.querySelector('#product-submit').textContent='Salvar alterações';document.querySelector('#product-cancel').classList.remove('hidden');f.scrollIntoView({behavior:'smooth',block:'center'})}
function cancelProductEdit(){editingProductId=null;const f=document.querySelector('#product-form');if(f)f.reset();const title=document.querySelector('#product-form-title');if(title)title.textContent='Cadastrar produto';const submit=document.querySelector('#product-submit');if(submit)submit.textContent='Salvar produto';const cancel=document.querySelector('#product-cancel');if(cancel)cancel.classList.add('hidden')}
function mergeProductGroup(ids){const group=state.products.filter(p=>ids.includes(p.id));if(group.length<2)return;const units=group.reduce((a,p)=>a+p.stock,0),value=group.reduce((a,p)=>a+p.stock*p.cost,0),avg=units?Math.round(value/units*100)/100:group[group.length-1].cost;const price=group[group.length-1].price;if(!confirm(`Unir ${group.length} registros de “${group[0].name}”? O estoque ficará em ${units} unidades, o custo será a média ponderada (${money(avg)}) e será mantido o preço de venda do cadastro mais recente (${money(price)}).`))return;consolidateProductRecords(group);persist();renderProductTable();toast('Cadastros unidos em um único item.')}
function renderProductTable(){const totalCost=state.products.reduce((a,p)=>a+p.stock*p.cost,0),totalRetail=state.products.reduce((a,p)=>a+p.stock*p.price,0),units=state.products.reduce((a,p)=>a+p.stock,0);const sm=document.querySelector('#stock-summary');if(sm){const avgCost=units?totalCost/units:0,avgRetail=units?totalRetail/units:0;sm.innerHTML=`<div class="row"><span class="muted">Unidades em estoque</span><strong>${units}</strong></div><div class="row"><span class="muted">Custo médio por unidade</span><strong>${money(avgCost)}</strong></div><div class="row"><span class="muted">Preço médio de venda por unidade</span><strong>${money(avgRetail)}</strong></div><div class="row"><span class="muted">Lucro bruto médio por unidade</span><strong>${money(avgRetail-avgCost)}</strong></div><div class="row"><span class="muted">Custo total do estoque</span><strong>${money(totalCost)}</strong></div><div class="row"><span class="muted">Venda prevista do estoque todo</span><strong>${money(totalRetail)}</strong></div><div class="help">Valores médios por unidade; lucro bruto não desconta taxas, impostos ou despesas.</div>`;};const table=document.querySelector('#product-table');if(!table)return;const alert=document.querySelector('#duplicate-alert');if(alert){const groups=duplicateGroups();alert.innerHTML=groups.map(group=>`<div class="block-note"><strong>Cadastro repetido:</strong> ${esc(group[0].name)} (${esc(group[0].category)}) aparece ${group.length} vezes. Estoque e custo podem ser consolidados num item. <button class="btn small secondary" data-merge-products="${group.map(p=>p.id).join(',')}">Unir cadastros</button></div>`).join('');alert.querySelectorAll('[data-merge-products]').forEach(b=>b.onclick=()=>mergeProductGroup(b.dataset.mergeProducts.split(',')))}if(!state.products.length){table.innerHTML='<div class="empty">Nenhum produto cadastrado.</div>';return}table.innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Produto</th><th>Categoria</th><th>Estoque</th><th>Custo un.</th><th>Venda un.</th><th>Lucro bruto un.</th><th></th></tr></thead><tbody>${state.products.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${esc(p.category)}</td><td>${p.stock}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${money(p.price-p.cost)}</td><td><div class="actions"><button class="btn small secondary" data-edit-product="${p.id}">Editar</button><button class="btn small danger" data-delete-product="${p.id}">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`;table.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>editProduct(b.dataset.editProduct));table.querySelectorAll('[data-delete-product]').forEach(b=>b.onclick=()=>{const p=state.products.find(x=>x.id===b.dataset.deleteProduct);if(!p)return;if(!confirm(`Excluir ${p.name} do estoque? Os contratos já feitos permanecem.`))return;if(editingProductId===p.id)cancelProductEdit();state.products=state.products.filter(x=>x.id!==p.id);persist();renderProductTable();toast('Produto excluído.')})}
function deleteSale(id){const s=state.sales.find(x=>x.id===id);if(!s)return;if(s.installments.some(it=>it.paid)){toast('Não posso excluir: há parcelas marcadas como pagas. Preserve o histórico do contrato.');return}const product=state.products.find(p=>p.id===s.productId);const restock=product?` As ${s.quantity} unidade(s) de “${product.name}” voltarão ao estoque.`:' O produto não existe mais no cadastro, então o estoque não será reposto.';if(!confirm(`Excluir o contrato de ${s.customer}? Esta ação não pode ser desfeita.${restock}`))return;if(product)product.stock+=s.quantity;state.sales=state.sales.filter(x=>x.id!==id);persist();setPage('sales');toast('Contrato excluído.')}
function beginEditSale(id){const s=state.sales.find(x=>x.id===id);if(!s)return;if(s.installments.some(it=>it.paid)){toast('Esta venda tem parcelas pagas. A edição está bloqueada para preservar o histórico.');return}setPage('edit-sale',id)}
function updateSale(e){e.preventDefault();const f=e.currentTarget;const old=state.sales.find(s=>s.id===receiptId);if(!old){toast('Venda não encontrada.');setPage('sales');return}if(old.installments.some(it=>it.paid)){toast('Esta venda tem parcelas pagas e não pode ser alterada.');setPage('receipt',old.id);return}const get=n=>f.elements.namedItem(n).value;const p=state.products.find(x=>x.id===get('productId'));const q=parseInt(get('quantity')),unit=Number(get('unitPrice')),n=parseInt(get('n')),rate=Number(get('rate'))||0,firstDue=get('firstDue'),customer=get('customer').trim(),whatsapp=get('whatsapp').trim();if(!p){toast('Escolha um produto cadastrado.');return}const available=p.stock+(p.id===old.productId?old.quantity:0);if(!Number.isInteger(q)||q<1||q>available){toast(`Estoque insuficiente. Disponível: ${available}.`);return}if(!customer||!whatsapp||!firstDue||!Number.isFinite(unit)||unit<=0||!Number.isInteger(n)||n<1||n>48||rate<0||rate>100){toast('Confira os dados da venda.');return}const principal=Math.round(q*unit*100)/100,c=calc(principal,n,rate);if(!confirm(`Salvar alterações? Novo total: ${money(c.total)}. Pagamentos: ${installmentLabel(c.amounts)}.`))return;const previous=state.products.find(x=>x.id===old.productId);if(previous)previous.stock+=old.quantity;p.stock-=q;Object.assign(old,{customer,whatsapp,itemName:p.name,category:p.category,productId:p.id,quantity:q,unitPrice:unit,principal,rate,n,firstDue,total:c.total,interest:c.interest,installments:Array.from({length:n},(_,i)=>({due:addMonth(firstDue,i),amount:c.amounts[i],paid:false})),updatedAt:todayISO()});persist();setPage('receipt',old.id);toast('Venda atualizada e parcelas recalculadas.')}
function previewSale(){const f=document.querySelector('#sale-form');if(!f)return;const get=n=>f.elements.namedItem(n).value;const p=state.products.find(x=>x.id===get('productId'));const old=page==='edit-sale'?state.sales.find(s=>s.id===receiptId):null;const available=p?p.stock+(old&&p.id===old.productId?old.quantity:0):0;const q=Math.max(1,parseInt(get('quantity'))||1),unit=Number(get('unitPrice'))||0,n=Math.max(1,parseInt(get('n'))||1),rate=Number(get('rate'))||0;const principal=q*unit;const c=calc(principal,n,rate);const quantityInput=f.elements.namedItem('quantity');if(p)quantityInput.max=available;const el=document.querySelector('#sale-preview');el.innerHTML=`<strong>${installmentLabel(c.amounts)}</strong><div class="smallline">Valor dos produtos: ${money(principal)} · Juros simples estimados: ${money(c.interest)}</div><div class="smallline"><b>Total do contrato: ${money(c.total)}</b>${rate?` · taxa ${rate.toFixed(2).replace('.',',')}% a.m., sobre o valor original`:' · sem juros'}</div>${p?`<div class="smallline">Estoque após venda: ${Math.max(0,available-q)} un.</div>`:''}`}
function addSale(e){e.preventDefault();const f=e.currentTarget;const p=state.products.find(x=>x.id===f.productId.value);if(!p){toast('Escolha um produto cadastrado.');return}const q=parseInt(f.quantity.value);if(!Number.isInteger(q)||q<1||q>p.stock){toast(`Estoque insuficiente. Disponível: ${p.stock}.`);return}const customer=f.customer.value.trim(),whatsapp=f.whatsapp.value.trim(),rate=Number(f.rate.value)||0,n=parseInt(f.n.value),firstDue=f.firstDue.value,unit=Number(f.unitPrice.value);if(!customer||!whatsapp||!firstDue||!Number.isFinite(unit)||unit<=0){toast('Preencha os dados da venda.');return}const principal=Math.round(q*unit*100)/100;const c=calc(principal,n,rate);const installments=Array.from({length:n},(_,i)=>({due:addMonth(firstDue,i),amount:c.amounts[i],paid:false}));const sale={id:newId(),customer,whatsapp,itemName:p.name,category:p.category,productId:p.id,quantity:q,unitPrice:unit,principal,rate,n,firstDue,total:c.total,interest:c.interest,installments,createdAt:todayISO()};if(!confirm(`Salvar venda para ${customer}? Total ${money(c.total)}. Pagamentos: ${installmentLabel(c.amounts)}.`))return;p.stock-=q;state.sales.push(sale);persist();setPage('receipt',sale.id);toast('Venda salva. Recibo pronto.')}
function togglePaid(id,index){const s=state.sales.find(x=>x.id===id);if(!s||!s.installments[index])return;const it=s.installments[index];if(!it.paid&&!confirm(`Marcar a parcela ${index+1} como paga? Confirme que recebeu.`))return;it.paid=!it.paid;persist();render();toast(it.paid?'Parcela marcada como paga.':'Pagamento desfeito.')}
function messageFor(s){return `RECIBO DE VENDA PARCELADA\nCliente: ${s.customer}\nProduto: ${s.itemName} (quantidade: ${s.quantity})\nValor dos produtos: ${money(s.principal)}\nJuros simples sobre valor original: ${Number(s.rate).toFixed(2).replace('.',',')}% ao mês\nTotal: ${money(s.total)} em ${s.n} parcelas\n\n${s.installments.map((it,i)=>`Parcela ${String(i+1).padStart(2,'0')}: ${money(it.amount)} — vence ${fmtDate(it.due)}`).join('\n')}\n\nComprovante gerado pelo controle da loja.`}
function shareReceipt(id){const s=state.sales.find(x=>x.id===id);if(!s)return;const text=messageFor(s);if(navigator.share){navigator.share({title:'Recibo de venda',text}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>toast('Recibo copiado. Cole no WhatsApp.')).catch(()=>toast('Não foi possível copiar o recibo.'))}else{window.prompt('Copie o recibo:',text)}}
function exportBackup(){const blob=new Blob([JSON.stringify({app:'VendaFácil',version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-vendafacil.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Cópia de segurança baixada.')}
render();
})();
</script>
